# AKTIV (V8.1, 08/2026): Läuft auf GitHub Actions bei jedem Push und Pull Request.
# Der grüne Haken neben dem Commit heißt: alle Tests sind durchgelaufen.
name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew test --no-daemon
